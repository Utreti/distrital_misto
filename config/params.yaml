# Parâmetros da simulação. Caminhos relativos à raiz do projeto.
# `uf` e `ano` são o padrão; `python src/pipeline.py --uf SP --ano 2018` escolhe outros.
# O número de cadeiras de cada UF vem dos eleitos no arquivo de candidatos.
uf: AC
ano: 2022
cargo: Deputado Federal

distritos:
  tolerancia_eleitorado: 0.20
  tolerancia_populacao_municipio: 0.05
  n_sementes: 200
  semente_aleatoria: 2022
  max_tentativas_corte: 10000
  processos: 14
  # Teto de memória somado dos processos filhos, dividido igualmente entre eles.
  memoria_maxima_gb_total: 60
  # Fase 3: passos de ReCom medidos em múltiplos do número de distritos de cada região.
  ensemble_cadeias: 14
  ensemble_amostras: 1400
  ensemble_burn_in: 10
  ensemble_passos_por_amostra: 1
  # Estados que só convergem (Gelman-Rubin abaixo de 1,1) com cadeias mais longas.
  ensemble_por_uf:
    PR: &cadeias_longas {ensemble_burn_in: 20, ensemble_passos_por_amostra: 4}
    SP: *cadeias_longas
    MG: *cadeias_longas
    BA: *cadeias_longas
    RJ: *cadeias_longas

# Linhas da figura, de cima para baixo (seção 1).
cenarios:
  - id: "real_{ano}"
    tipo: real
    rotulo: "Resultado real de {ano}"
  - id: pec_50_com_barreira
    tipo: pec
    proporcao_distrital: "1/2"
    metodo: quociente_atual
    barreira: true
    rotulo: PEC 50% · regra atual · com barreira
  - id: pec_50_sem_barreira
    tipo: pec
    proporcao_distrital: "1/2"
    metodo: quociente_atual
    barreira: false
    rotulo: PEC 50% · regra atual · sem barreira
  - id: pec_2_3_com_barreira
    tipo: pec
    proporcao_distrital: "2/3"
    metodo: quociente_atual
    barreira: true
    rotulo: PEC 2/3 · regra atual · com barreira
  - id: pec_2_3_sem_barreira
    tipo: pec
    proporcao_distrital: "2/3"
    metodo: quociente_atual
    barreira: false
    rotulo: PEC 2/3 · regra atual · sem barreira
  - id: distritao
    tipo: distritao
    rotulo: Distritão (100%)

# Fase 2: as colunas da comparação; as linhas são os cenários PEC acima.
metodos_comparados:
  - id: quociente_atual
    rotulo: Regra atual
  - id: dhondt
    rotulo: D'Hondt
  - id: sainte_lague
    rotulo: Sainte-Laguë

caminhos:
  fontes: "../eleicoes/{ano}"
  intermediario: "data/{ano}/interim"
  processed: "data/{ano}/processed"
  outputs: "outputs/{ano}"
  setores: data

# Arquivos nacionais (_BRASIL: todos os cargos; _BR contém apenas Presidente, não usar).
arquivos:
  candidatos: "consulta_cand_{ano}/consulta_cand_{ano}_BRASIL.csv"
  votacao_partido: "votacao_partido_munzona_{ano}/votacao_partido_munzona_{ano}_BRASIL.csv"
  votacao_candidato: "votacao_candidato_munzona_{ano}/votacao_candidato_munzona_{ano}_BRASIL.csv"
  detalhe_munzona: "detalhe_votacao_munzona_{ano}/detalhe_votacao_munzona_{ano}_BRASIL.csv"
  detalhe_secao: "detalhe_votacao_secao_{ano}/detalhe_votacao_secao_{ano}_BRASIL.csv"
  eleitorado_local: "eleitorado_local_votacao_{ano}/eleitorado_local_votacao_{ano}.csv"
  votacao_secao: "votacao_secao_{ano}_{uf}.zip"
  # Só para achar locais sem coordenada; a chave e o nome do local são os da própria eleição.
  locais_complementares: ../2026/eleitorado_local_votacao_2026.zip
  # A malha do Censo 2022 serve a todas as eleições.
  setores: ../2022/BR_setores_CD2022.zip
  agregados_basico: ../2022/Agregados_por_setores_basico_BR_20260520/Agregados_por_setores_basico_BR.csv

# Coligações proporcionais: só valem para validar o resultado real; a simulação usa partidos.
anos_com_coligacoes: [2018]

# O que muda em cada eleição.
arquivos_por_ano:
  2018:
    votacao_candidato: ../votacao_candidato_munzona_2018/votacao_candidato_munzona_2018_BRASIL.csv
    # MG e ES quase não têm coordenadas em 2018; a de 2022 coincide onde as duas existem.
    locais_por_secao: ../2022/eleitorado_local_votacao_2022/eleitorado_local_votacao_2022.csv
