# Parâmetros da simulação. Caminhos relativos à raiz do projeto.
# `uf` é o padrão; `python src/pipeline.py --uf SP` escolhe outra UF.
# O número de cadeiras de cada UF vem dos eleitos no arquivo de candidatos.
uf: AC
ano: 2022
cargo: Deputado Federal

distritos:
  tolerancia_eleitorado: 0.20
  tolerancia_populacao_municipio: 0.05
  n_sementes: 200
  semente_aleatoria: 2022
  max_tentativas_corte: 10000
  processos: 14
  # Teto de memória somado dos processos filhos, dividido igualmente entre eles.
  memoria_maxima_gb_total: 60
  # Fase 3: passos de ReCom medidos em múltiplos do número de distritos de cada região.
  ensemble_cadeias: 14
  ensemble_amostras: 1400
  ensemble_burn_in: 10
  ensemble_passos_por_amostra: 1

# Linhas da figura, de cima para baixo (seção 1).
cenarios:
  - id: real_2022
    tipo: real
    rotulo: Resultado real de 2022
  - id: pec_50_com_barreira
    tipo: pec
    proporcao_distrital: "1/2"
    metodo: quociente_atual
    barreira: true
    rotulo: PEC 50% · regra atual · com barreira
  - id: pec_50_sem_barreira
    tipo: pec
    proporcao_distrital: "1/2"
    metodo: quociente_atual
    barreira: false
    rotulo: PEC 50% · regra atual · sem barreira
  - id: pec_2_3_com_barreira
    tipo: pec
    proporcao_distrital: "2/3"
    metodo: quociente_atual
    barreira: true
    rotulo: PEC 2/3 · regra atual · com barreira
  - id: pec_2_3_sem_barreira
    tipo: pec
    proporcao_distrital: "2/3"
    metodo: quociente_atual
    barreira: false
    rotulo: PEC 2/3 · regra atual · sem barreira
  - id: distritao
    tipo: distritao
    rotulo: Distritão (100%)

# Fase 2: as colunas da comparação; as linhas são os cenários PEC acima.
metodos_comparados:
  - id: quociente_atual
    rotulo: Regra atual
  - id: dhondt
    rotulo: D'Hondt
  - id: sainte_lague
    rotulo: Sainte-Laguë

caminhos:
  fontes: ../eleicoes/2022
  intermediario: data/interim
  processed: data/processed
  outputs: outputs

# Arquivos nacionais (_BRASIL: todos os cargos; _BR contém apenas Presidente, não usar).
arquivos:
  candidatos: consulta_cand_2022/consulta_cand_2022_BRASIL.csv
  votacao_partido: votacao_partido_munzona_2022/votacao_partido_munzona_2022_BRASIL.csv
  votacao_candidato: votacao_candidato_munzona_2022/votacao_candidato_munzona_2022_BRASIL.csv
  detalhe_munzona: detalhe_votacao_munzona_2022/detalhe_votacao_munzona_2022_BRASIL.csv
  detalhe_secao: detalhe_votacao_secao_2022/detalhe_votacao_secao_2022_BRASIL.csv
  eleitorado_local: eleitorado_local_votacao_2022/eleitorado_local_votacao_2022.csv
  votacao_secao: votacao_secao_2022_{uf}.zip
  # Só para achar locais de 2022 sem coordenada; a chave e o nome do local são os de 2022.
  locais_complementares: ../2026/eleitorado_local_votacao_2026.zip
  setores: BR_setores_CD2022.zip
  agregados_basico: Agregados_por_setores_basico_BR_20260520/Agregados_por_setores_basico_BR.csv
